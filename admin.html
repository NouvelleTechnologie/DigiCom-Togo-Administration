
<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigiCom Togo Admin</title><script src="https://cdn.tailwindcss.com"></script>
<script src="script.js" type="text/javascript" charset="utf-8"></script>
</head><body class="bg-gray-50 min-h-screen"><script>
const SECURITY_KEY="DigiCom2027@";
function getUsers(){return JSON.parse(localStorage.getItem('users_digi_v8')||'[]');}function saveUsers(u){localStorage.setItem('users_digi_v8',JSON.stringify(u));}
function getProds(){return JSON.parse(localStorage.getItem('produits_digi_v8')||'[]');}function saveProds(p){localStorage.setItem('produits_digi_v8',JSON.stringify(p));}
function getCmds(){return JSON.parse(localStorage.getItem('commandes_v8')||'[]');}function saveCmds(c){localStorage.setItem('commandes_v8',JSON.stringify(c));}
function checkAdmin(){let v=document.getElementById('adminPass').value.trim(); if(v!==SECURITY_KEY &&!['Adeta2026','NEWTECHK2027','93721174'].includes(v)){document.getElementById('loginError').classList.remove('hidden');return;}document.getElementById('loginAdmin').classList.add('hidden');document.getElementById('adminContent').classList.remove('hidden');renderAll();}
function renderAll(){
 let users=getUsers(),prods=getProds(),cmds=getCmds();
 let ca=cmds.filter(c=>c.statut.includes('Paye')||c.statut.includes('Livre')).reduce((s,c)=>s+c.total,0);
 let aboAttente=users.filter(u=>u.abonnement && u.abonnement.attente).length;
 document.getElementById('stats').innerHTML=`<div class='grid grid-cols-2 md:grid-cols-5 gap-2 mb-4'><div class='bg-green-600 p-3 rounded-xl text-white'><b>${users.length}</b><p class=text-xs>Vendeurs</p></div><div class='bg-red-600 p-3 rounded-xl text-white'><b>${aboAttente}</b><p class=text-xs>abonnement a valider</p></div><div class='bg-blue-600 p-3 rounded-xl text-white'><b>${prods.filter(p=>p.statut==='en_attente').length}</b><p class=text-xs>Prod attente</p></div><div class='bg-purple-600 p-3 rounded-xl text-white'><b>${ca}F</b><p class=text-xs>CA</p></div><div class='bg-yellow-600 p-3 rounded-xl text-white'><b>${cmds.length}</b><p class=text-xs>Commandes</p></div></div>`;
 let hu='';for(let u of users){let exp=u.abonnement && u.abonnement.expiry?new Date(u.abonnement.expiry).toLocaleDateString():'-'; hu+=`<div class='bg-white p-3 rounded-xl mb-2 border-l-8 ${u.abonnement && u.abonnement.paid?'border-green-500':'border-red-500'}'><div class=flex justify-between><div><b>${u.name}</b> ${u.tel} ID:${u.idproduit}<br><span class=text-xs>GPS ${u.gps} | Exp ${exp} | ${u.abonnement?u.abonnement.forfait:''} ${u.abonnement && u.abonnement.transId?'Trans '+u.abonnement.transId:''}</span><br><span class=text-xs>${u.approuve?'✅ Approuve':'⏳ Non approuve'} | ${u.abonnement && u.abonnement.paid?'💰 Abo Paye':'❌ Abo non paye'}</span></div></div><div class='flex gap-1 mt-2'><button onclick='approveAbo("${u.tel}")' class='bg-green-600 text-white px-3 py-1 rounded-xl text-xs'>Valider Abonnement</button><button onclick='approveUser("${u.tel}")' class='bg-blue-600 text-white px-3 py-1 rounded-xl text-xs'>Approuver vendeur</button><a href='tel:${u.tel}' class='bg-gray-900 text-white px-3 py-1 rounded-xl text-xs'>📞 Appeler</a><button onclick='deleteUser("${u.tel}")' class='bg-red-100 text-red-600 px-3 py-1 rounded-xl text-xs'>Supprimer</button></div></div>`;}
 document.getElementById('listAbonnes').innerHTML=hu;
 let hp='';for(let p of prods){hp+=`<div class='bg-white p-3 rounded-xl mb-2 border-l-4 ${p.statut==='approuve'?'border-green-500':'border-yellow-400'}'><b>${p.nom}</b> ${p.prix}F - ${p.tel}<br><span class=text-xs>${p.statut}</span><div class='flex gap-1 mt-2'><button onclick='approveProd(${p.id})' class='bg-green-600 text-white px-2 py-1 rounded-xl text-xs'>Approuver</button><a href='tel:${p.tel}' class='bg-gray-900 text-white px-2 py-1 rounded-xl text-xs'>📞 Vendeur</a></div></div>`;}
 document.getElementById('listProduits').innerHTML=hp;
 let hc='';for(let c of getCmds()){hc+=`<div class='bg-white p-3 rounded-xl mb-2 border-l-8 ${c.statut.includes('Livre')?'border-green-500':'border-yellow-400'}'><b>${c.ref}</b> ${c.total}F ${c.distance||''}<br><span class=text-xs>Acheteur ${c.acheteur} ${c.tel} | Vendeur ${c.numVendeur}<br>${c.adresse} ${c.gps}</span><br><span class='text-xs font-bold'>${c.statut}</span><div class='flex gap-1 mt-2'><button onclick='validerPaye("${c.ref}")' class='bg-green-600 text-white px-2 py-1 rounded-xl text-xs'>Valider Paye</button><a href='tel:${c.tel}' class='bg-blue-600 text-white px-2 py-1 rounded-xl text-xs'>📞 Client</a><a href='tel:${c.numVendeur}' class='bg-gray-900 text-white px-2 py-1 rounded-xl text-xs'>📞 Vendeur</a></div></div>`;}
 document.getElementById('listCommandes').innerHTML=hc;
}
function approveAbo(tel){let u=getUsers();let i=u.findIndex(x=>x.tel===tel);u[i].abonnement.paid=true;u[i].abonnement.attente=false;u[i].abonnement.validatedAt=new Date().toISOString();saveUsers(u);renderAll();}
function approveUser(tel){let u=getUsers();let i=u.findIndex(x=>x.tel===tel);u[i].approuve=true;saveUsers(u);renderAll();}
function deleteUser(tel){if(!confirm('Suppr?'))return;saveUsers(getUsers().filter(x=>x.tel!==tel));renderAll();}
function approveProd(id){let p=getProds();let i=p.findIndex(x=>x.id===id);p[i].statut='approuve';saveProds(p);renderAll();}
function validerPaye(ref){let c=getCmds();let i=c.findIndex(x=>x.ref===ref);c[i].statut='Paye Verifie - '+c[i].transId;saveCmds(c);renderAll();}
function switchTab(t){['Abonnes','Produits','Commandes'].forEach(k=>document.getElementById('tab'+k).classList.add('hidden'));document.getElementById('tab'+t).classList.remove('hidden');}
</script>
<div id="loginAdmin" class="min-h-screen flex items-center justify-center p-4 bg-gray-900"><div class="bg-white rounded-3xl w-full max-w-md p-8 text-center"><h1 class="font-bold">DigiCom Togo Administration</h1><p class="text-xs">Cle sec</p><input id="adminPass" type="password" placeholder="Cle ou Mot de Pass" class="w-full mt-6 p-4 border-2 rounded-xl"><div id="loginError" class="hidden text-red-600 text-sm mt-2">Faux</div><button onclick="checkAdmin()" class="w-full mt-4 bg-gray-900 text-white py-4 rounded-xl font-bold">Deverrouiller</button></div></div>
<div id="adminContent" class="hidden"><header class="bg-gray-900 text-white p-4 sticky top-0 z-20"><h1 class="font-bold">Admin - Abonnements et Appels</h1><div id="stats" class="mt-3"></div><div class="flex gap-2 mt-3"><button onclick="switchTab('Abonnes')" class="bg-white text-gray-900 px-4 py-2 rounded-full text-xs font-bold">Abonnes / Abo</button><button onclick="switchTab('Produits')" class="bg-gray-700 text-white px-4 py-2 rounded-full text-xs">Produits</button><button onclick="switchTab('Commandes')" class="bg-gray-700 text-white px-4 py-2 rounded-full text-xs">Commandes</button></div></header><div class="p-4 max-w-6xl mx-auto"><div id="tabAbonnes"><div id="listAbonnes"></div></div><div id="tabProduits" class="hidden"><div id="listProduits"></div></div><div id="tabCommandes" class="hidden"><div id="listCommandes"></div></div></div></div>
</body></html>
